name: Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      changelog:
        required: true
        type: string
      image:
        required: true
        type: string
      digest:
        required: false
        type: string
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1

      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          image="${{ inputs.image }}:${{ inputs.version }}"
          date="$(date -u +%Y-%m-%d)"
          changelog="${{ inputs.changelog }}"

          {
            echo "## ${tag} - ${date}"
            echo
            echo "$changelog"
            echo
            echo "Docker image: ${image}"
            echo
          } > .release_entry.md

          {
            head -n 1 CHANGELOG.md
            echo
            cat .release_entry.md
            tail -n +2 CHANGELOG.md
          } > CHANGELOG.new.md
          mv CHANGELOG.new.md CHANGELOG.md

      - name: Set Maven version
        run: mvn -B -f src/pom.xml versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false

      - name: Update Helm chart version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          yq eval ".appVersion = \"$version\"" -i chart/Chart.yaml
          yq eval ".version = \"$version\"" -i chart/Chart.yaml
          yq eval ".image.tag = \"$version\"" -i chart/values.yaml

      - name: Generate Helm values schema
        shell: bash
        run: |
          set -euo pipefail
          helm plugin install https://github.com/karuppiah7890/helm-schema-gen.git --verify=false
          helm schema-gen chart/values.yaml > chart/values.schema.json

      - name: Commit release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md src/pom.xml chart/Chart.yaml chart/values.yaml chart/values.schema.json
          git commit -m "chore(release): ${{ inputs.tag }} [skip ci]" || exit 0
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build release JAR
        run: mvn -B -f src/pom.xml -DskipTests package

      - name: Package Helm chart
        run: helm package chart/ --destination ./release

      - name: Generate application SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./release
          mvn -B -f src/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom \
            -DoutputFormat=all \
            -DoutputName="ipfix-generator-${{ inputs.version }}-sbom" \
            -DoutputDirectory=./release

      - name: Publish Helm chart to charts repository
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git clone https://$GH_TOKEN@github.com/JFWenisch/charts.git charts-repo
          cp ./release/*.tgz charts-repo/ipfix-generator/
          cd charts-repo
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Add ipfix-generator helm chart in version ${{ inputs.version }}" || echo "No chart changes to commit"
          git push https://$GH_TOKEN@github.com/JFWenisch/charts.git main

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: |
            src/target/*.jar
            release/*.tgz
            release/*-sbom.json
            release/*-sbom.xml
          body: |
            ${{ inputs.changelog }}

            ## Docker image
            ```
            ${{ inputs.image }}:${{ inputs.version }}
            ${{ inputs.image }}@${{ inputs.digest }}
            ```
