name: Docker

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      image:
        required: true
        type: string
    outputs:
      digest:
        description: Pushed image digest
        value: ${{ jobs.docker.outputs.digest }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set Maven version
        run: mvn -B -f src/pom.xml versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false

      - name: Build application JAR
        run: mvn -B -f src/pom.xml -DskipTests package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ inputs.image }}:${{ inputs.version }}

      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name ipfix-generator-smoke -p 18080:8080 "${{ inputs.image }}:${{ inputs.version }}"
          trap 'docker logs ipfix-generator-smoke || true; docker stop ipfix-generator-smoke || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Container smoke test failed."
          exit 1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ inputs.image }}:${{ inputs.version }}
            ${{ inputs.image }}:latest
            ${{ inputs.image }}:main
            ${{ inputs.image }}:sha-${{ github.sha }}
